name: A52s Kernel Build (KSU Next + SUSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Zbycholudy
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget zip unzip tar \
            bc bison flex make \
            build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 rsync cpio dwarves

      # =========================
      # AOSP CLANG r530567 (ORIGINAL)
      # =========================
      - name: Download AOSP Clang r530567
        run: |
          mkdir -p clang
          cd clang

          wget -O clang.tar.gz \
          https://github.com/danjekb/tools/releases/download/clang/main-clang-r530567.tar.gz

          tar -xzf clang.tar.gz

          echo "===== CLANG STRUCTURE ====="
          ls -lah

      - name: Setup Clang PATH
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Verify Clang
        run: |
          clang --version
          which clang

      # =========================
      # KSU NEXT + SUSFS SETUP
      # =========================
      - name: KernelSU Next + SUSFS (legacy-susfs-v2)
        run: |
          curl -LSs "https://raw.githubusercontent.com/sidex15/KernelSU-Next/legacy-susfs-v2/kernel/setup.sh" | bash -s legacy-susfs-v2

      - name: Prepare output
        run: mkdir -p out

      # =========================
      # DEFCONFIG
      # =========================
      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/a52sxq_eur_open_defconfig

      # =========================
      # BUILD
      # =========================
      - name: Build kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # =========================
      # VERIFY
      # =========================
      - name: Verify output
        run: |
          echo "===== BOOT DIR ====="
          ls -lah out/arch/arm64/boot || true

          test -f out/arch/arm64/boot/Image

      # =========================
      # ANYKERNEL3
      # =========================
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3

          if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../out/arch/arm64/boot/Image.gz-dtb ./Image
          elif [ -f ../out/arch/arm64/boot/Image ]; then
            cp ../out/arch/arm64/boot/Image ./Image
          else
            echo "ERROR: No kernel image found"
            exit 1
          fi

          zip -r9 A52s-KSU-SUSFS.zip . \
            -x ".git*" -x "README.md"

      # =========================
      # ARTIFACTS
      # =========================
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image

      - name: Upload DTBO
        uses: actions/upload-artifact@v4
        with:
          name: DTBO
          path: out/arch/arm64/boot/dtbo.img
          if-no-files-found: ignore

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A52s-KSU-SUSFS
          path: AnyKernel3/A52s-KSU-SUSFS.zip
