name: A52s Kernel Build (KSU Next + SUSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Zbycholudy
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget zip unzip tar \
            bc bison flex make \
            build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 rsync cpio dwarves pahole

      # =========================
      # AOSP CLANG r530567 (ORIGINAL)
      # =========================
      - name: Download AOSP Clang r530567
        run: |
          mkdir -p clang
          cd clang
          wget -O clang.tar.gz \
            https://github.com/danjekb/tools/releases/download/clang/main-clang-r530567.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          if [ ! -f bin/clang ]; then
            echo "ERROR: Clang binary not found"
            exit 1
          fi

      - name: Setup Clang PATH
        run: echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Verify Clang
        run: |
          clang --version
          which clang

      # =========================
      # PATCHING: KernelSU Next + SUSFS
      # =========================
      - name: KernelSU Next + SUSFS (legacy-susfs-v2)
        run: |
          set -e
          # setup.sh klonuje do katalogu "KernelSU-Next/" — jeśli już istnieje, pomija clone.
          # Pre-klonujemy fork sidex15 (z SUSFS) zanim skrypt to zrobi, żeby nie trafił
          # na oficjalne KernelSU-Next/KernelSU-Next, które nie ma gałęzi legacy-susfs-v2.
          git clone --depth=1 \
            --branch legacy-susfs-v2 \
            https://github.com/sidex15/KernelSU-Next.git \
            KernelSU-Next
          # Ustawienie origin/HEAD potrzebne dla git rev-parse w setup.sh (set -eu)
          git -C KernelSU-Next remote set-head origin legacy-susfs-v2
          # Teraz setup.sh: widzi KernelSU-Next/ → pomija clone → git checkout legacy-susfs-v2 ✓
          curl -LSs "https://raw.githubusercontent.com/sidex15/KernelSU-Next/legacy-susfs-v2/kernel/setup.sh" \
            | bash -s legacy-susfs-v2
          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: KernelSU Next script failed"
            exit 1
          fi

      # =========================
      # DODATKOWE PATCHOWANIE (własne łatki)
      # =========================
      # Przykład: zastosuj łatkę z pliku w repozytorium
      # - name: Apply custom patches
      #   run: |
      #     git apply --verbose path/to/your.patch
      #     # lub dla wielu łatek:
      #     # for patch in patches/*.patch; do git apply "$patch"; done

      # Możesz też sklonować osobne repozytorium z łatkami:
      # - name: Clone patch repository
      #   run: git clone https://github.com/twoje/nasze-łatki.git
      # - name: Apply patches
      #   run: |
      #     cd nasze-łatki
      #     ./apply_patches.sh ../

      # =========================
      # BUILD (LLVM_IAS=1 – wymagane dla LTO/CFI)
      # =========================
      - name: Prepare output
        run: mkdir -p out

      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/a52sxq_eur_open_defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # =========================
      # VERIFY
      # =========================
      - name: Verify output
        run: |
          echo "===== BOOT DIR ====="
          ls -lah out/arch/arm64/boot/
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "Kernel image found: Image"
          else
            echo "ERROR: No kernel image found"
            exit 1
          fi

      # =========================
      # ANYKERNEL3
      # =========================
      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

      - name: Prepare AnyKernel3 files
        run: |
          cd AnyKernel3
          # Kopiuj jądro
          cp ../out/arch/arm64/boot/Image ./Image
          # Kopiuj dtb (jeśli istnieje)
          if [ -f ../out/arch/arm64/boot/dtb.img ]; then
            cp ../out/arch/arm64/boot/dtb.img ./dtb
          fi
          # Kopiuj dtbo (jeśli istnieje)
          if [ -f ../out/arch/arm64/boot/dtbo.img ]; then
            cp ../out/arch/arm64/boot/dtbo.img ./dtbo
          fi

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 A52s-KSU-SUSFS.zip . -x ".git*" -x "README.md"

      # =========================
      # ARTIFACTS
      # =========================
      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image

      - name: Upload DTBO (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: DTBO
          path: out/arch/arm64/boot/dtbo.img
          if-no-files-found: ignore

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A52s-KSU-SUSFS
          path: AnyKernel3/A52s-KSU-SUSFS.zip
